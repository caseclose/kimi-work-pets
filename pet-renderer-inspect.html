<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="daimon-pet-runtime" content="89">
  <title>Daimon Pet</title>
  <style>
    :root {
      color-scheme: light dark;
      --pet-bubble-background: #fff;
      --pet-bubble-foreground: #25262b;
      --pet-bubble-border: transparent;
      --pet-bubble-surface: #fff;
      --pet-bubble-text: #25262b;
      --pet-center-label: #25262b;
      --pet-card-surface: color-mix(in srgb, var(--pet-bubble-surface) 88%, transparent);
      --pet-card-border: color-mix(in srgb, var(--pet-bubble-text) 9%, transparent);
      --pet-secondary: color-mix(in srgb, var(--pet-bubble-text) 62%, transparent);
      --pet-control-surface: color-mix(in srgb, var(--pet-bubble-text) 3%, transparent);
      --pet-shadow: rgba(0, 0, 0, 0.10);
      --pet-blue: #238bff;
      --pet-warning: #ff384f;
    }
    :root[data-theme='dark'] {
      --pet-center-label: #f7f8fa;
      --pet-bubble-surface: #262626;
      --pet-bubble-text: #e3e3e3;
      --pet-card-surface: color-mix(in srgb, var(--pet-bubble-surface) 96%, transparent);
      --pet-shadow: rgba(0, 0, 0, 0.20);
      --pet-control-surface: color-mix(in srgb, var(--pet-bubble-text) 7%, transparent);
      --pet-warning: #ff486a;
    }
    .conversation-card-action.is-error svg { transform: rotate(180deg); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden !important; background: transparent !important; }
    body { user-select: none; -webkit-user-select: none; }
    #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #conversation-bubble {
      position: absolute;
      z-index: 2;
      bottom: 0;
      left: 50%;
      width: min(280px, calc(100% - 24px));
      padding: 0;
      color: var(--pet-bubble-text);
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 160ms ease;
    }
    #stage.bubble-visible #conversation-bubble { pointer-events: auto; visibility: visible; opacity: 1; }
    #conversation-center-header { display: flex; justify-content: flex-end; margin-bottom: 6px; }
    #conversation-center-header[hidden], .conversation-card[hidden], [hidden] { display: none !important; }
    #conversation-center-collapse {
      appearance: none;
      border: 1px solid var(--pet-card-border);
      border-radius: 12px;
      padding: 2px 7px;
      background: var(--pet-card-surface);
      color: var(--pet-secondary);
      font: 10px/1.4 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: 0 2px 8px var(--pet-shadow);
    }
    #conversation-list { position: relative; padding: 12px; margin: -12px; }
    #conversation-bubble.notification-expanded #conversation-list {
      max-height: var(--pet-conversation-list-max-height, 380px);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
    }
    #conversation-list::-webkit-scrollbar { display: none; }
    #conversation-list.fade-top { mask-image: linear-gradient(to bottom, transparent, black 18px); }
    #conversation-list.fade-bottom { mask-image: linear-gradient(to top, transparent, black 18px); }
    #conversation-list.fade-top.fade-bottom { mask-image: linear-gradient(to bottom, transparent, black 18px, black calc(100% - 18px), transparent); }
    #conversation-bubble.notification-collapsed.has-three-or-more::before,
    #conversation-bubble.notification-collapsed.has-multiple::after {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 0 8px -5px;
      border: 1px solid var(--pet-card-border);
      border-radius: 18px;
      background: var(--pet-card-surface);
      box-shadow: 0 4px 14px var(--pet-shadow);
      backdrop-filter: blur(16px);
    }
    #conversation-bubble.notification-collapsed.has-three-or-more::before { inset: 0 16px -10px; opacity: 0.6; }
    .conversation-card {
      position: relative;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--pet-card-border);
      border-radius: 18px;
      background: var(--pet-card-surface);
      color: var(--pet-bubble-text);
      box-shadow: 0 4px 14px var(--pet-shadow);
      backdrop-filter: blur(16px) saturate(1.12);
      -webkit-backdrop-filter: blur(16px) saturate(1.12);
      font: 12px/1.4 system-ui, sans-serif;
    }
    #conversation-bubble button, #conversation-bubble input { min-block-size: 0; min-inline-size: 0; }
    #conversation-bubble input[type='text'] { border: 0; border-radius: 0; padding: 0; outline: none; background: transparent; }
    #conversation-bubble .conversation-card-copy:hover, #conversation-bubble .conversation-card-copy:active { background: transparent; }
    #conversation-bubble .conversation-card-action:hover { background: var(--pet-control-surface); }
    .conversation-card + .conversation-card { margin-top: 6px; }
    .conversation-card-row { display: flex; align-items: center; gap: 8px; min-height: 36px; }
    .conversation-card-copy { flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: start; cursor: pointer; }
    .conversation-card-title, .conversation-card-content { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .conversation-card-title { font-weight: 500; }
    .conversation-card-content { margin-top: 2px; color: var(--pet-secondary); }
    .conversation-card-progress { display: inline-block; max-width: 100%; vertical-align: bottom; overflow: hidden; text-overflow: ellipsis; }
    .conversation-card.is-running .conversation-card-progress {
      background-color: var(--pet-secondary);
      background-image: linear-gradient(90deg, transparent 35%, var(--pet-bubble-text) 50%, transparent 65%);
      background-size: 300% 100%;
      background-repeat: no-repeat;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: pet-progress-shimmer 2.2s linear infinite;
    }
    @keyframes pet-progress-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
    .conversation-card-actions { display: flex; flex: none; align-items: center; gap: 6px; }
    .conversation-card-action { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: var(--pet-control-surface); color: inherit; cursor: pointer; }
    .conversation-card-action.is-complete { color: var(--pet-blue); background: color-mix(in srgb, var(--pet-blue) 10%, transparent); }
    .conversation-card-action.is-error { color: var(--pet-warning); background: transparent; }
    .conversation-card-close { position: absolute; left: -5px; top: -5px; display: none; place-items: center; width: 16px; height: 16px; border: 1px solid var(--pet-card-border); border-radius: 50%; padding: 0; background: var(--pet-bubble-surface); color: var(--pet-secondary); box-shadow: 0 1px 5px var(--pet-shadow); cursor: pointer; }
    .conversation-card .hover-action { display: none; }
    .conversation-card:hover .hover-action, .keyboard-navigation .conversation-card:has(:focus-visible) .hover-action, .conversation-card.has-reply .hover-action { display: grid; }
    .conversation-card button:focus, #conversation-center-collapse:focus, #conversation-bubble-toggle:focus { outline: none; }
    .keyboard-navigation .conversation-card button:focus-visible, .keyboard-navigation #conversation-center-collapse:focus-visible { outline: 2px solid var(--pet-blue); outline-offset: 2px; }
    .conversation-card button:disabled { cursor: default; opacity: 0.45; }
    .conversation-card-composer { display: flex; align-items: center; gap: 4px; padding: 4px 5px 4px 7px; margin-top: 6px; border-radius: 10px; background: var(--pet-control-surface); }
    .conversation-card-composer input { width: 0; min-width: 0; flex: 1; padding: 0; border: 0; outline: none; background: transparent; color: inherit; font: inherit; user-select: text; -webkit-user-select: text; }
    .conversation-card-composer input::placeholder { color: var(--pet-secondary); }
    .conversation-card-composer button { display: grid; place-items: center; border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; }
    .conversation-card-error { margin: 5px 0 0; font-size: 11px; color: var(--pet-warning); }
    #pet {
      position: absolute;
      left: 50%;
      bottom: 0;
      display: none;
      transform-origin: 50% 100%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      will-change: background-position, transform;
    }
    #rive-pet {
      position: absolute;
      left: 50%;
      bottom: 0;
      display: none;
      width: 128px;
      height: 128px;
      contain: strict;
      transform: translateX(-50%);
    }
    #conversation-bubble-toggle {
      all: unset;
      position: absolute;
      z-index: 3;
      display: none;
      box-sizing: border-box;
      width: 30px !important;
      min-width: 30px !important;
      max-width: 30px !important;
      height: 30px !important;
      min-height: 30px !important;
      max-height: 30px !important;
      inline-size: 30px !important;
      min-inline-size: 30px !important;
      max-inline-size: 30px !important;
      block-size: 30px !important;
      min-block-size: 30px !important;
      max-block-size: 30px !important;
      aspect-ratio: 1;
      place-items: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--pet-card-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--pet-card-border);
      box-shadow: 0 2px 6px rgba(31, 35, 41, 0.14);
      color: var(--pet-bubble-text);
      font: 600 11px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .keyboard-navigation #conversation-bubble-toggle:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--pet-bubble-text) 56%, transparent);
      outline-offset: 2px;
    }
    #conversation-bubble-toggle-icon {
      display: block;
      width: 18px;
      height: 18px;
    }
    #conversation-bubble-toggle-count {
      display: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .conversation-card-progress { animation: none !important; color: var(--pet-secondary) !important; }
      #conversation-bubble,
      .conversation-card,
      .conversation-card-content-clip,
      .conversation-card-close {
        transition-duration: 1ms !important;
      }
    }
    #error {
      position: absolute;
      inset: 12px;
      display: none;
      place-items: center;
      color: #b91c1c;
      font: 12px/1.4 system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="桌宠">
    <section id="conversation-bubble" aria-label="最近任务" aria-live="polite">
      <header id="conversation-center-header" hidden>
        <button id="conversation-center-collapse" type="button">清除全部</button>
      </header>
      <div id="conversation-list"></div>
    </section>
    <div id="pet" role="img"></div>
    <canvas id="rive-pet" role="img"></canvas>
    <button
      id="conversation-bubble-toggle"
      type="button"
      aria-expanded="true"
      aria-label="隐藏会话状态"
    >
      <svg
        id="conversation-bubble-toggle-icon"
        viewBox="0 0 12 12"
        aria-hidden="true"
      >
        <path
          d="M2.75 4.5 6 7.75 9.25 4.5"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
        ></path>
      </svg>
      <span id="conversation-bubble-toggle-count"></span>
    </button>
    <div id="error" role="status"></div>
  </main>
