  - article [ref=e14]:
    - paragraph [ref=e15]: Internals
    - heading "Kimi Work 桌面宠物机制调研" [level=1] [ref=e16]
    - paragraph [ref=e17]:
      - text: 调研日期：2026-09-15 · 平台：macOS · Kimi Work 桌面端。源稿见仓库
      - link "how-kimi-work-pet-works.md" [ref=e18] [cursor=pointer]:
        - /url: https://github.com/caseclose/kimi-work-pets/blob/main/docs/how-kimi-work-pet-works.md
      - text: 。
    - heading "1. 桌宠的存储位置" [level=2] [ref=e19]
    - code [ref=e21]: "~/Library/Application Support/kimi-desktop/daimon-share/daimon/agents/main/blueprint/ ├── pet/ │ ├── current.json # 当前选中的桌宠 + 已安装列表 │ ├── default-kimi-v3.json # 版本标记 {\"version\": 3} │ └── library/ │ ├── kimi/ # 默认桌宠(Rive 动画) │ │ ├── pet.json │ │ └── pet.riv │ └── <pet-id>/ # 其他已安装桌宠 └── widgets/widget_<id>/ # 桌宠实际渲染组件(kind: \"pet\") ├── widget.json └── workspace/ ├── index.html # 渲染器页面(自带 rive wasm) ├── pet.json # 渲染器实际读取的 manifest └── spritesheet.webp / pet.riv"
    - paragraph [ref=e22]:
      - code [ref=e23]: current.json
      - text: 的
      - code [ref=e24]: installed[].widgetId
      - text: 指向桌宠组件；渲染器加载时请求
      - code [ref=e25]: /workspace/pet.json
      - text: ，据此决定渲染方式。
    - heading [level=2] [ref=e26]:
      - text: 2. Manifest 格式（
      - code [ref=e27]: pet.json
      - text: ）
    - paragraph [ref=e28]:
      - text: 两种渲染器，由
      - code [ref=e29]: renderer
      - text: 字段区分（缺省走精灵图分支）。
    - heading "Rive 动画（默认 Kimi 形象）" [level=3] [ref=e30]
    - code [ref=e32]: "{ \"schemaVersion\": 1, \"id\": \"kimi\", \"name\": \"Kimi\", \"renderer\": \"rive\", \"rive\": { \"file\": \"pet.riv\", \"stateMachine\": \"KimiAvator_homepage\" }, \"theme\": { \"bubble\": { \"background\": \"#445F7E\", \"foreground\": \"#FFFFFF\", \"border\": \"#6D829A\" } } }"
    - paragraph [ref=e33]:
      - text: 校验逻辑：若
      - code [ref=e34]: renderer === "rive"
      - text: ，强制要求
      - code [ref=e35]: rive.file === "pet.riv"
      - text: 。状态机
      - code [ref=e36]: KimiAvator_homepage
      - text: 的输入包括
      - code [ref=e37]: click_avator
      - text: 、
      - code [ref=e38]: change_color
      - text: 以及眼动方向（
      - code [ref=e39]: upper_left
      - text: 等，跟随鼠标）。
    - heading "精灵图（与 Codex 社区宠物格式兼容）" [level=3] [ref=e40]
    - paragraph [ref=e41]: 9 行 × 8 列的标准布局（以迪莫为例）：
    - figure [ref=e42]:
      - img "迪莫精灵表 9 行布局示例" [ref=e43]
    - code [ref=e45]: "{ \"schemaVersion\": 1, \"id\": \"dimo\", \"name\": \"Dimo\", \"spritesheet\": \"spritesheet.webp\", \"atlas\": { \"frameWidth\": 192, \"frameHeight\": 208, \"columns\": 8, \"rows\": 9 }, \"states\": { \"idle\": { \"row\": 0, \"frames\": 6, \"fps\": 4, \"loop\": true }, \"working\": { \"row\": 7, \"frames\": 6, \"fps\": 8, \"loop\": true }, \"waiting\": { \"row\": 6, \"frames\": 6, \"fps\": 5, \"loop\": true }, \"running_left\": { \"row\": 2, \"frames\": 8, \"fps\": 10, \"loop\": true }, \"running_right\": { \"row\": 1, \"frames\": 8, \"fps\": 10, \"loop\": true }, \"failed\": { \"row\": 5, \"frames\": 8, \"fps\": 6, \"loop\": true }, \"idle_random_1\": { \"row\": 3, \"frames\": 4, \"fps\": 3, \"loop\": true }, \"idle_random_2\": { \"row\": 4, \"frames\": 5, \"fps\": 6, \"loop\": true } } }"
    - paragraph [ref=e46]:
      - text: 校验逻辑：
      - code [ref=e47]: atlas
      - text: 、
      - code [ref=e48]: states
      - text: 、
      - code [ref=e49]: states.idle
      - text: 必须存在。
      - code [ref=e50]: render()
      - text: 用
      - code [ref=e51]: background-position
      - text: 取帧：
      - code [ref=e52]: x = -frame*frameWidth
      - text: ，
      - code [ref=e53]: y = -state.row*frameHeight
      - text: ；
      - code [ref=e54]: "loop: false"
      - text: 时播完停在最后一帧并回到首选状态。
    - paragraph [ref=e55]:
      - text: 宿主状态映射（
      - code [ref=e56]: resolveStateName
      - text: ）：
    - table [ref=e58]:
      - rowgroup [ref=e59]:
        - row [ref=e60]:
          - columnheader "宿主事件" [ref=e61]
          - columnheader "精灵图状态" [ref=e62]
          - columnheader "缺省回退" [ref=e63]
      - rowgroup [ref=e64]:
        - row [ref=e65]:
          - cell "会话运行" [ref=e66]
          - cell [ref=e67]:
            - code [ref=e68]: working
          - cell [ref=e69]:
            - code [ref=e70]: idle
        - row [ref=e71]:
          - cell "等待确认" [ref=e72]
          - cell [ref=e73]:
            - code [ref=e74]: waiting
          - cell [ref=e75]:
            - code [ref=e76]: idle
        - row [ref=e77]:
          - cell "拖动向左" [ref=e78]
          - cell [ref=e79]:
            - code [ref=e80]: running_left
          - cell [ref=e81]:
            - code [ref=e82]: dragLeft
            - text: →
            - code [ref=e83]: idle
        - row [ref=e84]:
          - cell "拖动向右" [ref=e85]
          - cell [ref=e86]:
            - code [ref=e87]: running_right
          - cell [ref=e88]:
            - code [ref=e89]: dragRight
            - text: →
            - code [ref=e90]: idle
        - row [ref=e91]:
          - cell "空闲随机动作" [ref=e92]
          - cell [ref=e93]:
            - code [ref=e94]: idle_random_1/2
          - cell "无（不触发）" [ref=e95]
        - row [ref=e96]:
          - cell "失败" [ref=e97]
          - cell [ref=e98]:
            - code [ref=e99]: failed
          - cell [ref=e100]:
            - code [ref=e101]: idle
    - paragraph [ref=e102]:
      - code [ref=e103]: idle_random_1/2
      - text: 仅在空闲时随机延迟触发，让宠物「自己找事做」（招手、雀跃）。
    - heading "3. 换形象的最小步骤" [level=2] [ref=e104]
    - list [ref=e105]:
      - listitem [ref=e106]:
        - text: 把素材放进
        - code [ref=e107]: pet/library/<id>/
        - text: 与桌宠组件
        - code [ref=e108]: workspace/
        - text: 。
      - listitem [ref=e109]:
        - text: 用 Kimi 格式重写
        - code [ref=e110]: pet.json
        - text: （社区 Codex 包字段不同，需要转换）。
      - listitem [ref=e111]:
        - text: 更新
        - code [ref=e112]: pet/current.json
        - text: 的
        - code [ref=e113]: selectedPetId
        - text: 与
        - code [ref=e114]: installed[0].manifest
        - text: 。
      - listitem [ref=e115]: 重启 Kimi 应用（渲染器只在加载时读取配置）。
    - paragraph [ref=e116]:
      - code [ref=e117]: scripts/install.py
      - text: 实现了以上全部步骤并自动备份；Codex 社区包先用
      - code [ref=e118]: scripts/convert-codex-pet.py
      - text: 转换。
